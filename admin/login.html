<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>অ্যাডমিন লগইন | myGov মাইগভ ডেমো</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23006a4e'/%3E%3Ccircle cx='46' cy='18' r='6' fill='%23d9382e'/%3E%3C/svg%3E" />
</head>
<body class="admin-body">
  <main class="admin-login-wrap">
    <div class="admin-login-card">
      <div class="admin-login-head">
        <svg width="56" height="56" viewBox="0 0 64 64" role="img" aria-label="myGov admin">
          <circle cx="32" cy="32" r="30" fill="#ffffff" opacity="0.14" />
          <path d="M20 44V20h6l12 15V20h6v24h-6L26 29v15z" fill="#fff" />
          <circle cx="46" cy="18" r="5.5" fill="#d9382e" />
        </svg>
        <h1>অ্যাডমিন প্যানেল লগইন</h1>
        <p>Integrated Service Delivery — Administration Console</p>
      </div>
      <div class="admin-login-body">
        <div class="banner banner-demo" id="demo-banner" hidden>
          <span>🧪</span>
          <div><b>ডেমো মোড।</b> নিচের ডেমো ক্রেডেনশিয়াল দিয়ে এক ক্লিকে লগইন করুন।</div>
        </div>
        <div class="admin-cred-hint" id="cred-hint" hidden>
          ডেমো অ্যাডমিন — আইডি: <code id="hint-user">admin@mygov-demo.app</code><br />
          পাসওয়ার্ড: <code id="hint-pass">Admin@123</code>
        </div>

        <form id="admin-login-form" novalidate>
          <div class="field">
            <label for="username">অ্যাডমিন আইডি / ইমেইল <span class="req">*</span></label>
            <input class="input" id="username" type="text" autocomplete="username" placeholder="admin@mygov-demo.app" />
            <div class="error-msg">আইডি লিখুন</div>
          </div>
          <div class="field">
            <label for="password">পাসওয়ার্ড <span class="req">*</span></label>
            <div class="password-wrap">
              <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
              <button class="toggle-pw" type="button" data-target="password">দেখুন</button>
            </div>
            <div class="error-msg">পাসওয়ার্ড লিখুন</div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="btn-admin-login">অ্যাডমিন লগইন</button>
        </form>

        <div class="auth-divider">ডেমো</div>
        <div style="display:flex;gap:.7rem;flex-wrap:wrap">
          <button class="btn btn-outline btn-block" type="button" id="btn-fill-demo">⚡ ডেমো ক্রেডেনশিয়াল বসান</button>
        </div>
        <p class="auth-alt"><a href="../index.html">← নাগরিক সাইটে ফিরে যান</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/backend.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/admin/login.js"></script>
</body>
</html>
