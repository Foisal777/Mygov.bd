<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সেবা সমূহ | myGov মাইগভ ডেমো</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23006a4e'/%3E%3Ccircle cx='46' cy='18' r='6' fill='%23d9382e'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="site-header"></div>

  <section class="hero" style="padding:2.4rem 0 2.6rem">
    <div class="container">
      <h1 style="font-size:1.7rem">সেবা খাত সমূহ</h1>
      <p>সেবা খাত, দপ্তর বা সেবাগ্রহীতা অনুসারে খুঁজুন এবং অনলাইনে আবেদন করুন।</p>
      <form class="search-box" id="service-search" style="margin-top:1rem">
        <input type="search" id="service-query" placeholder="সেবার নাম বা দপ্তর লিখে খুঁজুন…" aria-label="সেবা খুঁজুন" />
        <button class="btn btn-primary" type="submit">🔍 অনুসন্ধান</button>
      </form>
    </div>
  </section>

  <main class="section" style="padding-top:2rem">
    <div class="container">
      <h2 class="text-sm" style="text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">সেবা খাত ফিল্টার</h2>
      <div class="chip-row" id="sector-chips"></div>
      <h2 class="text-sm" style="text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">সেবাগ্রহীতা</h2>
      <div class="chip-row" id="recipient-chips"></div>

      <p id="result-count" class="text-muted text-sm"></p>
      <div class="grid grid-3" id="service-grid"></div>
      <div class="empty-state" id="empty-state" hidden>
        <span class="es-icon">🔎</span>
        <b>কোনো সেবা পাওয়া যায়নি</b>
        <p>অন্য কিওয়ার্ড বা ফিল্টার চেষ্টা করুন।</p>
      </div>
    </div>
  </main>

  <!-- Service detail modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h3 id="modal-title">সেবার বিবরণ</h3>
        <button class="modal-close" id="modal-close" aria-label="বন্ধ">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="assets/js/services-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/backend.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/services.js"></script>
</body>
</html>
